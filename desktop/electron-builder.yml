appId: dev.watchparty.uploader
productName: WatchParty Uploader
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# ffmpeg is a native binary: it can't execute from inside app.asar.
asarUnpack:
  - node_modules/ffmpeg-static/**
mac:
  target:
    - target: dmg
      # ffmpeg-static ships the binary for the machine it was installed on, so build each Mac arch on that arch
      # (an x64 dmg built on Apple Silicon would contain an arm64 ffmpeg).
      arch: [arm64]
  category: public.app-category.video
  # A platform `files` list replaces the top-level one, so it repeats the includes (otherwise everything,
  # .env included, would be packed).
  files:
    - out/**
    - package.json
    - "!node_modules/ffmpeg-static/ffmpeg.exe*"
win:
  target:
    - target: nsis
      arch: [x64]
  # Ship only ffmpeg.exe (fetched by scripts/fetch-win-ffmpeg.mjs), not the host's ffmpeg.
  files:
    - out/**
    - package.json
    - "!node_modules/ffmpeg-static/ffmpeg"
    - "!node_modules/ffmpeg-static/ffmpeg.LICENSE"
    - "!node_modules/ffmpeg-static/ffmpeg.README"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# ffmpeg-static installs the binary for the host OS; `pnpm dist:win` also fetches the Windows one,
# so the Windows installer can be built on a Mac too.
